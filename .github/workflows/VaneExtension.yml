name: Vane LeRobot

on:
  push:
    branches: [v1.5-variegata_vane]
  pull_request:
    branches: [v1.5-variegata_vane]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vane-lerobot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-check:
    name: Code quality
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@72e76e99cd7fee45a99739cd118ec2db64e034ec
    with:
      duckdb_version: d8cdaa33fda8df955cc76ef58a280f68f4cd43fa
      ci_tools_version: 72e76e99cd7fee45a99739cd118ec2db64e034ec
      extension_name: lerobot
      format_checks: 'format'

  upstream:
    name: Upstream DuckDB / FFmpeg ${{ matrix.ffmpeg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ffmpeg: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config ccache libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
      - name: Prepare the existing pinned test-host fix
        run: |
          test "$(git -C duckdb rev-parse HEAD)" = d8cdaa33fda8df955cc76ef58a280f68f4cd43fa
          git clone --shared duckdb build/native-source
          git -C build/native-source apply ../../test/patches/duckdb-1.5.5-cached-eof.patch
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ccache
          key: upstream-lerobot-${{ runner.os }}-${{ matrix.ffmpeg }}-${{ github.sha }}
          restore-keys: upstream-lerobot-${{ runner.os }}-${{ matrix.ffmpeg }}-
      - name: Build the unchanged upstream extension
        run: |
          cmake -S build/native-source -B build/native-compat -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DDUCKDB_EXTENSION_CONFIGS="$PWD/extension_config.cmake" \
            -DUNITTEST_ROOT_DIRECTORY="$PWD" -DENABLE_UNITTEST_CPP_TESTS=OFF \
            -DENABLE_SANITIZER=OFF -DENABLE_UBSAN=OFF \
            -DLEROBOT_ENABLE_FFMPEG=${{ matrix.ffmpeg }} -DLEROBOT_ALLOW_GPL=ON
          cmake --build build/native-compat --parallel 4 --target \
            unittest lerobot_loadable_extension lerobot_codec_executor_test \
            lerobot_video_producer_test lerobot_nested_query_test lerobot_video_io_test
      - name: Run upstream SQL and lifecycle regressions
        env:
          FFMPEG: ${{ matrix.ffmpeg }}
        run: |
          if [[ "$FFMPEG" == ON ]]; then export LEROBOT_FFMPEG_TESTS=1; fi
          build/native-compat/test/unittest 'test/sql/lerobot*'
          for test in codec_executor video_producer nested_query video_io; do
            timeout 180s "build/native-compat/extension/lerobot/test/lerobot_${test}_test"
          done
          git -C duckdb diff --exit-code

  vane-regressions:
    name: Vane DuckDB / FFmpeg and lifecycle regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VANE_SOURCE_DIR: ${{ github.workspace }}/build/vane-source
      VANE_TEST_BUILD_DIR: ${{ github.workspace }}/build/vane-regressions
      LEROBOT_FFMPEG_TESTS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Read the pinned Vane manifest
        id: manifest
        run: |
          python vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest vane-extension.toml --extension-root "$PWD" \
            manifest --github-output "$GITHUB_OUTPUT"
      - name: Checkout exact Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: build/vane-source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Vane identity
        id: identity
        run: |
          python vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest vane-extension.toml --extension-root "$PWD" \
            identity --vane-source "$VANE_SOURCE_DIR" --github-output "$GITHUB_OUTPUT"
      - name: Install regression build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config ccache libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          python -m pip install 'cmake>=3.29'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ccache
          key: vane-lerobot-regressions-${{ runner.os }}-${{ steps.manifest.outputs.vane_revision }}-${{ github.sha }}
          restore-keys: vane-lerobot-regressions-${{ runner.os }}-${{ steps.manifest.outputs.vane_revision }}-
      - name: Build Vane SQL and C++ regressions with system FFmpeg
        env:
          VANE_UPSTREAM_VERSION: ${{ steps.identity.outputs.upstream_version }}
          VANE_FORK_VERSION: ${{ steps.identity.outputs.fork_version }}
          VANE_SOURCE_ID: ${{ steps.identity.outputs.source_id }}
        run: |
          # The media regressions include HEVC depth encoding. GPL opt-in is
          # confined to this test build; packaged artifacts use pinned vcpkg.
          cmake -S "$VANE_SOURCE_DIR/external/duckdb" -B "$VANE_TEST_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=20 -DBUILD_DISTRIBUTED_EXCHANGE=OFF \
            -DDUCKDB_SOURCE_PATH="$VANE_SOURCE_DIR/external/duckdb" \
            -DDUCKDB_EXTENSION_CONFIGS="$PWD/extension_config_vane.cmake" \
            -DUNITTEST_ROOT_DIRECTORY="$PWD" -DBUILD_UNITTESTS=ON -DENABLE_UNITTEST_CPP_TESTS=OFF \
            -DENABLE_EXTENSION_AUTOLOADING=OFF -DENABLE_EXTENSION_AUTOINSTALL=OFF \
            -DENABLE_SANITIZER=OFF -DENABLE_UBSAN=OFF \
            -DLEROBOT_ENABLE_FFMPEG=ON -DLEROBOT_ALLOW_GPL=ON -DLEROBOT_AV1_ENCODER=libaom \
            -DOVERRIDE_GIT_DESCRIBE="${VANE_UPSTREAM_VERSION}-0-g${VANE_SOURCE_ID:0:10}" \
            -DDUCKDB_EXPLICIT_VERSION="$VANE_FORK_VERSION" -DGIT_COMMIT_HASH="${VANE_SOURCE_ID:0:10}"
          cmake --build "$VANE_TEST_BUILD_DIR" --parallel 4 --target \
            unittest lerobot_loadable_extension lerobot_codec_executor_test \
            lerobot_video_producer_test lerobot_nested_query_test lerobot_video_io_test
      - name: Run Vane SQL including the six FFmpeg suites
        run: '"$VANE_TEST_BUILD_DIR/test/unittest" "test/sql/lerobot*"'
      - name: Run Vane producer, nested-query and lifecycle C++ suites
        run: |
          for test in codec_executor video_producer nested_query video_io; do
            timeout 180s "$VANE_TEST_BUILD_DIR/extension/lerobot/native/test/lerobot_${test}_test"
          done

  vane-build:
    name: Vane native extension and linked wheel
    uses: AstroVela/vane-extension-ci-tools/.github/workflows/_vane_extension_ci.yml@d7316f29add0cc893c5fd126a971ffb78cc39c78
    with:
      ci_tools_version: d7316f29add0cc893c5fd126a971ffb78cc39c78
      manifest: vane-extension.toml
      python_version: '3.12'
      build_jobs: 4
      run_native_tests: true

  vane-runtime:
    name: Packaged Vane / ${{ matrix.runner }}
    needs: vane-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [local-fast, ray]
    env:
      VANE_RUNNER: ${{ matrix.runner }}
      VANE_FTE_DYNAMIC_SCAN_MAX_SPLITS_PER_PARTITION: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vane-lerobot-wheel
          path: build/wheels
      - name: Install the verified wheel in a clean environment
        run: |
          python -m venv build/runtime
          build/runtime/bin/python -m pip install build/wheels/*.whl
      - name: Read, decode, write, rollback and verify worker topology
        run: build/runtime/bin/python -I test/vane/test_runtime.py
