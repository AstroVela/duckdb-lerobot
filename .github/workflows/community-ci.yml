name: Community Installation

on:
  push:
    branches: [v1.5-variegata]
    paths:
      - README.md
      - .github/workflows/community-ci.yml
      - test/community/**
  pull_request:
    branches: [v1.5-variegata]
    paths:
      - README.md
      - .github/workflows/community-ci.yml
      - test/community/**
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  install:
    name: Install and query / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the supported DuckDB client
        run: |
          python -m pip install --only-binary=:all: duckdb==1.5.5
      - name: Test the published community extension
        run: python -m unittest discover -s test/community -v
