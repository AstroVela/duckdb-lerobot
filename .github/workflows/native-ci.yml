name: Native CI

on:
  push:
    branches:
      - v1.5-variegata
  pull_request:
    branches:
      - v1.5-variegata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: release-no-ffmpeg
            name: Release / FFmpeg disabled
            build_target: release
            test_target: test_release
            build_dir: build/release
            ffmpeg: false
            sanitizers: false
            cmake_options: >-
              -DLEROBOT_ENABLE_FFMPEG=OFF
              -DENABLE_SANITIZER=OFF
              -DENABLE_UBSAN=OFF
          - id: release-ffmpeg
            name: Release / FFmpeg + libaom
            build_target: release
            test_target: test_release
            build_dir: build/release
            ffmpeg: true
            sanitizers: false
            rgb_codec: libaom-av1
            cmake_options: >-
              -DLEROBOT_ENABLE_FFMPEG=ON
              -DLEROBOT_AV1_ENCODER=libaom
              -DENABLE_SANITIZER=OFF
              -DENABLE_UBSAN=OFF
          - id: sanitize-ffmpeg
            name: ASAN + UBSAN / FFmpeg + SVT
            build_target: reldebug
            test_target: test_reldebug
            build_dir: build/reldebug
            ffmpeg: true
            sanitizers: true
            rgb_codec: libsvtav1
            cmake_options: >-
              -DLEROBOT_ENABLE_FFMPEG=ON
              -DLEROBOT_AV1_ENCODER=svt
              -DFORCE_ASSERT=ON
              -DENABLE_SANITIZER=ON
              -DENABLE_UBSAN=ON

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GEN: ninja

    steps:
      - name: Check out the pinned DuckDB source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply the pinned test-host EOF fix
        run: |
          test "$(git -C duckdb rev-parse HEAD)" = d8cdaa33fda8df955cc76ef58a280f68f4cd43fa
          git -C duckdb apply --check ../test/patches/duckdb-1.5.5-cached-eof.patch
          git -C duckdb apply ../test/patches/duckdb-1.5.5-cached-eof.patch

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache ninja-build pkg-config python3-venv

      - name: Check benchmark process accounting
        run: python3 -m unittest discover -s test/python -p 'test_*.py' -v

      - name: Install FFmpeg development packages
        if: matrix.ffmpeg
        run: |
          sudo apt-get install -y -qq \
            ffmpeg \
            libaom-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libdav1d-dev \
            libsvtav1-dev \
            libswscale-dev \
            libx265-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: >-
            native-${{ runner.os }}-duckdb-1.5.5-${{ matrix.id }}-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-duckdb-1.5.5-${{ matrix.id }}-

      - name: Build and run the complete extension suite
        env:
          EXT_FLAGS: >-
            ${{ matrix.cmake_options }}
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        run: |
          ccache --max-size=750M
          ccache --zero-stats
          if [[ "${{ matrix.ffmpeg }}" == "true" ]]; then
            export LEROBOT_FFMPEG_TESTS=1
          fi
          if [[ "${{ matrix.sanitizers }}" == "true" ]]; then
            export ASAN_OPTIONS='detect_leaks=0:halt_on_error=1'
            export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          fi
          make "${{ matrix.build_target }}" GEN="${GEN}" EXT_FLAGS="${EXT_FLAGS}"
          make "${{ matrix.test_target }}"
          ccache --show-stats

      - name: Check codec executor growth, budgets and cancellation
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          timeout 60s "${{ matrix.build_dir }}/extension/lerobot/test/lerobot_codec_executor_test"

      - name: Check decoder lifetime with LeakSanitizer
        if: matrix.sanitizers
        env:
          LEROBOT_FFMPEG_TESTS: '1'
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          "${{ matrix.build_dir }}/test/unittest" 'test/sql/lerobot_video_frames.test'

      - name: Check concurrent mixed-resolution video against FFmpeg
        if: matrix.ffmpeg
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 test/conformance/test_mixed_video.py \
            --duckdb "${{ matrix.build_dir }}/duckdb" \
            --extension "${{ matrix.build_dir }}/extension/lerobot/lerobot.duckdb_extension" \
            --codec "${{ matrix.rgb_codec }}" \
            --workdir "${{ matrix.build_dir }}/mixed-video-conformance"
          python3 test/conformance/test_mixed_video.py \
            --duckdb "${{ matrix.build_dir }}/duckdb" \
            --extension "${{ matrix.build_dir }}/extension/lerobot/lerobot.duckdb_extension" \
            --codec "${{ matrix.rgb_codec }}" \
            --fps 30 --episode-lengths 1 2 3 6 \
            --workdir "${{ matrix.build_dir }}/video-timing-conformance"

      - name: Check video I/O failures, rollback and retry
        if: matrix.ffmpeg
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          timeout 180s "${{ matrix.build_dir }}/extension/lerobot/test/lerobot_video_io_test"

      - name: Check numeric statistics, COPY binding cancellation and cleanup
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          timeout 60s "${{ matrix.build_dir }}/extension/lerobot/test/lerobot_video_io_test" '[numeric_stats],[copy_bind],[copy_cleanup]'

      - name: Check custom video I/O lifetime with LeakSanitizer
        if: matrix.sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          timeout 60s "${{ matrix.build_dir }}/extension/lerobot/test/lerobot_video_io_test" '[video_io],[video_copy_cancel]'

      - name: Check PNG reuse, COPY cancellation and cleanup with LeakSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          timeout 60s "${{ matrix.build_dir }}/extension/lerobot/test/lerobot_video_io_test" '[image_writer],[image_copy]'

      - name: Check video producer cancellation and ownership
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          timeout 60s "${{ matrix.build_dir }}/extension/lerobot/test/lerobot_video_producer_test"

      - name: Check routing caches, timestamp indexes and nested reader lifetime
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          timeout 60s "${{ matrix.build_dir }}/extension/lerobot/test/lerobot_nested_query_test"

      - name: Check S3 cache isolation and session settings on loopback
        if: matrix.id == 'release-ffmpeg'
        run: |
          "${{ matrix.build_dir }}/duckdb" -c 'INSTALL httpfs;'
          python3 test/conformance/test_session_settings.py \
            --duckdb "${{ matrix.build_dir }}/duckdb" \
            --extension "${{ matrix.build_dir }}/extension/lerobot/lerobot.duckdb_extension"

      - name: Verify pinned build configuration
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          expected_duckdb_commit="$(git ls-tree HEAD duckdb | awk '{print $3}')"
          test "${expected_duckdb_commit}" = 'd8cdaa33fda8df955cc76ef58a280f68f4cd43fa'
          test "$(git -C duckdb rev-parse HEAD)" = "${expected_duckdb_commit}"
          grep -Fxq 'CMAKE_CXX_STANDARD:STRING=11' "${BUILD_DIR}/CMakeCache.txt"
          if [[ "${{ matrix.ffmpeg }}" == "true" ]]; then
            grep -q -- '-DLEROBOT_HAVE_FFMPEG=1' "${BUILD_DIR}/compile_commands.json"
            ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libx265'
            if [[ "${{ matrix.id }}" == "release-ffmpeg" ]]; then
              grep -q -- '-DLEROBOT_AV1_ENCODER_LIBAOM=1' "${BUILD_DIR}/compile_commands.json"
              ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libaom-av1'
            else
              grep -q -- '-DLEROBOT_AV1_ENCODER_SVT=1' "${BUILD_DIR}/compile_commands.json"
              ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libsvtav1'
            fi
          else
            ! grep -q -- '-DLEROBOT_HAVE_FFMPEG=1' "${BUILD_DIR}/compile_commands.json"
          fi
          if [[ "${{ matrix.sanitizers }}" == "true" ]]; then
            grep -q -- '-fsanitize=address' "${BUILD_DIR}/compile_commands.json"
            grep -q -- '-fsanitize=undefined' "${BUILD_DIR}/compile_commands.json"
          fi

      - name: Verify release-gate inputs
        if: matrix.id == 'release-no-ffmpeg'
        run: |
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          test -s test/conformance/test_bidirectional.py
          grep -Fxq 'numpy==2.2.6' test/conformance/requirements.txt
          grep -Fxq 'torchcodec==0.5' test/conformance/requirements.txt
          grep -Fxq 'lerobot[dataset]==0.6.1' test/conformance/requirements.txt

      - name: Run pinned LeRobot bidirectional conformance
        if: matrix.id == 'release-no-ffmpeg' || matrix.id == 'release-ffmpeg'
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          python3 -m venv "${BUILD_DIR}/conformance-venv"
          "${BUILD_DIR}/conformance-venv/bin/python" -m pip install --upgrade pip
          "${BUILD_DIR}/conformance-venv/bin/python" -m pip install \
            torch==2.7.1 torchvision==0.22.1 torchcodec==0.5 \
            --index-url https://download.pytorch.org/whl/cpu
          "${BUILD_DIR}/conformance-venv/bin/python" -m pip install \
            -r test/conformance/requirements.txt
          "${BUILD_DIR}/conformance-venv/bin/python" \
            test/conformance/test_bidirectional.py \
            --duckdb "${BUILD_DIR}/duckdb" \
            --extension "${BUILD_DIR}/extension/lerobot/lerobot.duckdb_extension"
          "${BUILD_DIR}/conformance-venv/bin/python" \
            test/conformance/test_numeric_stats.py \
            --duckdb "${BUILD_DIR}/duckdb" \
            --extension "${BUILD_DIR}/extension/lerobot/lerobot.duckdb_extension"

      - name: Run pinned LeRobot visual conformance
        if: matrix.id == 'release-ffmpeg'
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          "${BUILD_DIR}/conformance-venv/bin/python" test/conformance/test_visual.py \
            --duckdb "${BUILD_DIR}/duckdb" \
            --extension "${BUILD_DIR}/extension/lerobot/lerobot.duckdb_extension"
          "${BUILD_DIR}/conformance-venv/bin/python" test/conformance/test_image_copy.py \
            --duckdb "${BUILD_DIR}/duckdb" \
            --extension "${BUILD_DIR}/extension/lerobot/lerobot.duckdb_extension"
          "${BUILD_DIR}/conformance-venv/bin/python" test/conformance/test_video_shards.py \
            --duckdb "${BUILD_DIR}/duckdb" \
            --extension "${BUILD_DIR}/extension/lerobot/lerobot.duckdb_extension"

      - name: Restore the pinned test-host source after testing
        run: |
          git -C duckdb apply --reverse --check ../test/patches/duckdb-1.5.5-cached-eof.patch
          git -C duckdb apply --reverse ../test/patches/duckdb-1.5.5-cached-eof.patch

      - name: Reject generated or build files outside ignored paths
        run: |
          if git ls-files | grep -Eq '(^|/)(build|cmake-build-[^/]*|duckdb_unittest_tempdir|__pycache__)(/|$)|[.]pyc$'; then
            echo 'Tracked build artifact detected'
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short --untracked-files=all
            echo 'Build generated an unignored repository file'
            exit 1
          fi
